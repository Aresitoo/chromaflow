# ==============================================================================
# AresLab Real-Time Energy Flow & Autarky Scorecard Card
# Example Lovelace Configurations
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Standard Configuration with EV / Electric Vehicle (Default)
# ------------------------------------------------------------------------------
type: custom:ares-energy-flow-card
palette: solar                         # solar | synthwave | cyberpunk | nord | midnight | emerald | ocean | fitness | halloween | christmas

# Contracted Power Guard: Set to your contracted utility ceiling (in kW).
# The card will glow amber at 85% of this value, and flash crimson at 100%+.
contract_power_limit_kw: 4.2
contract_warning_pct: 0.85

# Max expected system power envelope (in kW) used to dynamically scale flow speeds:
max_expected_power_kw: 7.5

# Display Solcast PV Forecast pill and progress bar in the Solar box:
show_solar_forecast: true

# Custom title for the EV / Wallbox consumer node:
ev_name: "Tesla"

# Entity mappings:
entities:
  # Solar Photovoltaic:
  solar_power: sensor.solar_power                      # Live Solar generation (Watts)
  solar_daily_yield: sensor.solar_daily_yield          # Today's Solar generation (kWh)

  # Grid Import / Export:
  # For grid_power, provide a sensor where positive = import (from grid) and negative = export (to grid).
  grid_power: sensor.grid_power                        # Live net grid power (Watts)
  grid_daily_import: sensor.grid_daily_import_energy   # Today's Grid import (kWh)
  grid_daily_export: sensor.grid_daily_export_energy   # Today's Grid export (kWh)

  # Electric Vehicle / High-Load Consumer:
  ev_power: sensor.ev_charging_power                   # Live EV charging power (Watts)
  ev_charging: binary_sensor.ev_charging               # EV charging active state (on/off)
  ev_daily_energy: sensor.ev_daily_energy              # Today's EV energy consumed (kWh)

  # Optional Solar Forecast (Solcast):
  solcast_today: sensor.solcast_pv_forecast_forecast_today                 # Estimated total today (kWh)
  solcast_remaining: sensor.solcast_pv_forecast_forecast_remaining_today   # Estimated remaining today (kWh)


# ------------------------------------------------------------------------------
# 2. Home Battery / BESS Configuration (Tesla Powerwall, Enphase, SolarEdge, etc.)
# ------------------------------------------------------------------------------
# In this mode, the middle slot transforms into a bidirectional Home Battery (BESS)
# with live State-of-Charge (SoC %) progress bar and animated discharge directly into Home.
#
# type: custom:ares-energy-flow-card
# palette: solar
# device_type: battery                 # Activates BESS Battery mode (replaces EV slot)
# battery_name: "Powerwall"            # Custom label (e.g., 'Powerwall', 'BESS', 'Enphase')
# contract_power_limit_kw: 4.2
# max_expected_power_kw: 7.5
# show_solar_forecast: true
# entities:
#   solar_power: sensor.solar_power
#   solar_daily_yield: sensor.solar_daily_yield
#   grid_power: sensor.grid_power
#   grid_daily_import: sensor.grid_daily_import_energy
#   grid_daily_export: sensor.grid_daily_export_energy
#   # Battery Storage Sensors:
#   battery_power: sensor.battery_power                      # Live Watts (positive = charge, negative = discharge)
#   battery_soc: sensor.battery_state_of_charge              # State of charge percentage (0-100%)
#   battery_daily_charge: sensor.battery_daily_charge_energy # Today's energy charged into battery (kWh)
#   battery_daily_discharge: sensor.battery_daily_discharge_energy # Today's energy supplied from battery (kWh)
#   # Optional Solar Forecast:
#   solcast_today: sensor.solcast_pv_forecast_forecast_today
#   solcast_remaining: sensor.solcast_pv_forecast_forecast_remaining_today


# ------------------------------------------------------------------------------
