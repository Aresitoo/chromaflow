# 5. Multiple Solar Sources (two or more inverters / arrays)
# ------------------------------------------------------------------------------
# Each source gets its own sub-tile inside the Solar box (live power, today's kWh
# and share of current output). The Solar total is the sum of the sources unless
# entities.solar_power / entities.solar_daily_yield are set explicitly.
#
